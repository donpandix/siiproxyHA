spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: siiproxyHA

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

minio:
  endpoint: ${MINIO_ENDPOINT}
  console-endpoint: ${MINIO_CONSOLE_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  certificates-bucket: ${MINIO_CERTIFICATES_BUCKET}

localstack:
  endpoint: ${LOCALSTACK_ENDPOINT}
  region: ${LOCALSTACK_REGION}
  services: ${LOCALSTACK_SERVICES}

# Configuración de seguridad para cifrado de certificados
security:
  encryption:
    # Clave maestra para cifrar contraseñas (se obtiene de variable de entorno en producción)
    # En dev: generar con: openssl rand -hex 32
    master-key: ${ENCRYPTION_MASTER_KEY}
    algorithm: AES/GCM/NoPadding
    key-size: 256

# Jasypt configuration (opcional, para cifrar properties sensibles)
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator

dte:
  xsd-path: classpath:xsd
  signing-zone: ${DTE_SIGNING_ZONE:America/Santiago}

sii:
  environment: ${SII_ENVIRONMENT:CERTIFICATION}
  production-enabled: ${SII_PRODUCTION_ENABLED:false}
  worker-enabled: ${SII_WORKER_ENABLED:true}
  connect-timeout: ${SII_CONNECT_TIMEOUT:10s}
  request-timeout: ${SII_REQUEST_TIMEOUT:30s}
  token-ttl: ${SII_TOKEN_TTL:55m}
  worker-delay: ${SII_WORKER_DELAY:2s}
  claim-lease: ${SII_CLAIM_LEASE:5m}
  max-upload-attempts: ${SII_MAX_UPLOAD_ATTEMPTS:5}
  upload-retry-initial-delay: ${SII_UPLOAD_RETRY_INITIAL_DELAY:30s}
  upload-retry-max-delay: ${SII_UPLOAD_RETRY_MAX_DELAY:5m}
  max-reconciliation-attempts: ${SII_MAX_RECONCILIATION_ATTEMPTS:5}
  reconciliation-initial-delay: ${SII_RECONCILIATION_INITIAL_DELAY:2m}
  reconciliation-max-delay: ${SII_RECONCILIATION_MAX_DELAY:30m}
  max-status-queries: ${SII_MAX_STATUS_QUERIES:30}
  certification:
    seed-url: ${SII_CERT_SEED_URL:https://maullin.sii.cl/DTEWS/CrSeed.jws}
    token-url: ${SII_CERT_TOKEN_URL:https://maullin.sii.cl/DTEWS/GetTokenFromSeed.jws}
    upload-url: ${SII_CERT_UPLOAD_URL:https://maullin.sii.cl/cgi_dte/UPL/DTEUpload}
    status-url: ${SII_CERT_STATUS_URL:https://maullin.sii.cl/DTEWS/QueryEstUp.jws}
    dte-status-url: ${SII_CERT_DTE_STATUS_URL:https://maullin.sii.cl/DTEWS/services/QueryEstDteAv}
  production:
    seed-url: ${SII_PROD_SEED_URL:https://palena.sii.cl/DTEWS/CrSeed.jws}
    token-url: ${SII_PROD_TOKEN_URL:https://palena.sii.cl/DTEWS/GetTokenFromSeed.jws}
    upload-url: ${SII_PROD_UPLOAD_URL:https://palena.sii.cl/cgi_dte/UPL/DTEUpload}
    status-url: ${SII_PROD_STATUS_URL:https://palena.sii.cl/DTEWS/QueryEstUp.jws}
    dte-status-url: ${SII_PROD_DTE_STATUS_URL:https://palena.sii.cl/DTEWS/services/QueryEstDteAv}

# Actuator management settings
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      # Use default health groups. If you need explicit groups, set
      # 'management.endpoint.health.validate-group-membership=false' or
      # define members that exist (e.g. 'db', 'diskSpace').
