openapi: 3.0.3
info:
  title: SiiproxyHA API
  version: 0.1.0
  description: API mínima para ingest de DTE (documentos tributarios electrónicos).
servers:
  - url: http://localhost:8080
paths:
  /api/v1/tenants/{id}:
    put:
      summary: Actualizar parcialmente una empresa
      description: >
        Actualiza únicamente los campos no nulos presentes en el cuerpo. Los
        campos omitidos o nulos conservan su valor actual. Si receptores se
        omite, conserva la colección; si se envía como lista vacía, elimina
        sus elementos.
      tags:
        - tenants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
            example:
              acteco: '726000'
              email: cesar@cesarg.cl
              fchResol: '2020-08-14'
              nroResol: 80
              active: true
      responses:
        '200':
          description: Empresa actualizada sin alterar campos omitidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Fecha o número de resolución inválido
        '404':
          description: Empresa no encontrada
        '409':
          description: Conflicto con una restricción de unicidad

  /api/v1/dte:
    post:
      summary: Ingestar un DTE (XML base64)
      tags:
        - dte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DteRequest'
            example:
              documentId: doc-1234567890
              emitterRUT: 11111111-1
              receiverRUT: 22222222-2
              xmlBase64: ""
              assignFolio: true
              tipoDte: 33
              puntoVenta: 1
              requestId: req-1234567890
              assignedTo: POSTMAN
      responses:
        '201':
          description: Documento creado o resultado idempotente de una solicitud previa
          headers:
            Location:
              description: URL al recurso creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DteStatusResponse'
        '400':
          description: Petición inválida
        '409':
          description: Conflicto con otra restricción de unicidad del dominio

  /api/v1/dte/{id}/status:
    get:
      summary: Obtener estado de procesamiento de un DTE
      tags:
        - dte
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado del documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DteStatusResponse'
        '404':
          description: Documento no encontrado

  /api/v1/dte/{id}/xml:
    get:
      summary: Obtener XML original o URL prefirmada para descarga
      tags:
        - dte
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          required: false
          description: >
            Usar application/xml para descargar los bytes firmados exactos en
            ISO-8859-1, sin transcodificación.
          schema:
            type: string
      responses:
        '200':
          description: XML base64, URL prefirmada o XML firmado binario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DteXmlResponse'
            application/xml:
              schema:
                type: string
                format: binary
        '404':
          description: Documento no encontrado

  /api/v1/dte/{id}/xml/regenerate:
    post:
      summary: Regenerar, firmar y almacenar nuevamente el XML de un DTE existente
      description: >
        Reconstruye el EnvioDTE desde el snapshot persistido, conserva el folio
        y la asignación CAF, firma Documento y SetDTE con la credencial vigente,
        reemplaza el artefacto bajo el mismo objectKey y actualiza checksum,
        tamaño, estado e historial.
      tags:
        - dte
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: XML firmado regenerado y almacenado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DteStatusResponse'
        '400':
          description: El identificador no es un UUID válido
        '404':
          description: DTE no encontrado
        '409':
          description: Ya existe una regeneración activa o el estado no permite regenerar
        '503':
          description: No fue posible almacenar el XML regenerado

components:
  schemas:
    TenantUpdateRequest:
      type: object
      description: Todos los campos son opcionales y solo se actualizan si contienen un valor no nulo.
      properties:
        tenantCode:
          type: string
          maxLength: 50
        rutEmisor:
          type: string
          maxLength: 12
        razonSocial:
          type: string
          maxLength: 100
        giro:
          type: string
          maxLength: 80
        acteco:
          type: string
          maxLength: 6
        direccion:
          type: string
          maxLength: 70
        comuna:
          type: string
          maxLength: 20
        ciudad:
          type: string
          maxLength: 20
        email:
          type: string
          maxLength: 80
        fchResol:
          type: string
          format: date
          description: Fecha de resolución SII en formato YYYY-MM-DD.
        nroResol:
          type: integer
          minimum: 0
          maximum: 999999
        active:
          type: boolean
        receptores:
          type: array
          description: Omitir para conservar; enviar una lista vacía para eliminar todos.
          items:
            type: object

    TenantResponse:
      allOf:
        - $ref: '#/components/schemas/TenantUpdateRequest'
        - type: object
          required:
            - id
            - tenantCode
            - rutEmisor
            - razonSocial
            - active
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time

    DteRequest:
      type: object
      required:
        - emitterRUT
        - receiverRUT
      properties:
        documentId:
          type: string
          description: Identificador externo/idempotente del documento (opcional)
        emitterRUT:
          type: string
          description: RUT emisor
        receiverRUT:
          type: string
          description: RUT receptor
        xmlBase64:
          type: string
          description: Contenido XML codificado en base64 (opcional)
        assignFolio:
          type: boolean
          description: Si es true, asigna folio automáticamente al ingresar el DTE
          default: true
        tipoDte:
          type: integer
          description: Tipo de DTE a usar para asignación automática (default 33)
        puntoVenta:
          type: integer
          description: Punto de venta para la asignación automática (default 1)
        requestId:
          type: string
          description: Idempotency key para asignación de folio
        assignedTo:
          type: string
          description: Identificador del actor/sistema que solicita la asignación

    DteStatusResponse:
      type: object
      required:
        - documentId
        - status
      properties:
        id:
          type: integer
          format: int64
        documentId:
          type: string
        folio:
          type: string
        status:
          type: string
          enum:
            - RECEIVED
            - VALIDATED
            - FOLIO_ASSIGNED
            - TED_GENERATED
            - SIGNED
            - PENDING_STORE
            - STORED
            - ENQUEUED
            - SENT
            - FAILED_RECOVERABLE
            - FAILED_FATAL
        objectKey:
          type: string
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        sizeBytes:
          type: integer
          format: int64
        attemptCount:
          type: integer
          minimum: 0
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DteXmlResponse:
      type: object
      properties:
        documentId:
          type: string
        xmlBase64:
          type: string
        presignedUrl:
          type: string
          description: URL prefirmada (opcional)
